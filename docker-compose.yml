services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: recon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon_secret
      POSTGRES_DB: reconos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d reconos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: recon_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://recon:recon_secret@db:5432/reconos
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      LOG_LEVEL: INFO
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEFAULT_MERCHANT_NAME: "RECON Demo Merchant"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Next.js Frontend Application
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_API_URL must be a BUILD arg, not just a runtime env var —
      # Next.js inlines NEXT_PUBLIC_* into the client bundle at `npm run
      # build` time. Override via `NEXT_PUBLIC_API_URL=https://api.example.com
      # docker compose build web` (or export it before `docker compose up
      # --build`) for a real deployment; defaults to localhost for local dev.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: recon_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
